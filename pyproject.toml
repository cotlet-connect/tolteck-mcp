[project]
name = "tolteck-mcp"
version = "1.1.0"
description = "Connect Tolteck to ChatGPT, Claude and any AI agent through Cotlet.dev, a hosted MCP server. No Tolteck API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["tolteck", "tolteck api", "tolteck mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/tolteck-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=tolteck"
Source = "https://github.com/cotlet-connect/tolteck-mcp"

[project.scripts]
tolteck-mcp = "tolteck_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"tolteck_agent.py" = "tolteck_agent.py"

[tool.hatch.build.targets.sdist]
include = ["tolteck_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
